<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech 2.0 - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BiblioTech</h1>
        <p id="subtitulo-header">A sua Biblioteca favorita!</p>
    </header>

    <main class="container">
        <section id="tela-login" class="coluna">
            <h2>Tela de Login</h2>
            <form id="form-login">
                <input type="text" id="login-email" placeholder="E-mail (ou 'admin')" required>
                <input type="password" id="login-senha" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p class="mudanca-tela">
                Não tem conta? <a href="cadastro.html"><span>Cadastre-se aqui</span></a>
            </p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
